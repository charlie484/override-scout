<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Override Scout · 1940D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="VEX V5RC scouting, stats, TrueSkill, match predictions and robot tools — built by team 1940D Override.">
  <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Override">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://events.vex.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('os.settings') || '{}');
        var t = s.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://cdn.jsdelivr.net/npm/preact@10.24.3/dist/preact.module.js",
      "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.24.3/hooks/dist/hooks.module.js",
      "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js"
    }
  }
  </script>
  <script src="config.js"></script>
</head>
<body>
  <div id="app">
    <div class="boot">
      <img class="boot-mark" src="assets/mark-dark.png" alt="" width="72" height="78">
      <div class="boot-bar"><span></span></div>
    </div>
  </div>
  <noscript>
    <p style="padding:24px;font-family:system-ui">Override Scout needs JavaScript to run.</p>
  </noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
